# reference 
# https://dev.to/iggredible/useful-tmux-configuration-examples-k3g

# default(prefix), -n(root), -T(copy-mode)
set		-g	mouse		on
set		-g	base-index	1
# scrollback buffer size increase
set		-g	history-limit	100000



# bar color
set		-g	status-bg	colour235
set		-g	status-fg	colour83
# highlight current window
set-window-option -g window-status-current-style fg=colour235,bg=colour83



setw		-g	mode-keys	vi
# disable window name auto change
set-option	-g	allow-rename	off


########### window
# change window order
bind		-n	C-S-Left	    swap-window		-t	-1
bind		-n	C-S-Right	    swap-window		-t	+1
# split window
bind			v		        split-window		-hc "#{pane_current_path}"
bind			s		        split-window		-vc "#{pane_current_path}"
# synchronize-panes 
#unbind y
bind			y		        set-window-option	synchronize-panes
# tmux-yank의 prefix+y 기본 동작 비활성화
#set -g @yank_action ''

########### pane
# Shift-Alt-arrow keys without prefix key to switch panes
bind		-n	M-Left		    select-pane		-L
bind		-n	M-Right		    select-pane		-R
bind		-n	M-Up		    select-pane		-U
bind		-n	M-Down		    select-pane		-D
# swap pane
bind		-n	S-M-Up		    swap-pane		-U
bind		-n	S-M-Down	    swap-pane		-D
# resize pane
bind		-r	M-LEFT		    resize-pane		-L	10
bind		-r	M-Right		    resize-pane		-R	10
bind		-r	M-Up		    resize-pane		-U	5
bind		-r	M-Down		    resize-pane		-D	5
# border
#set-option -g pane-active-border-style "bg=colour83"
set -g pane-active-border-style '#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,bg=colour83}}'


# Shift arrow to switch windows
bind		-n	S-Left		    previous-window
bind		-n	S-Right		    next-window
# copy of selection to tmux buffer & sys clipboard  in vi-copy mode
bind		-T	copy-mode-vi y	send-keys		-X	copy-pipe-and-cancel	'xclip -in -selection clipboard'


bind		    r		        source-file	~/.tmux.conf \; display "Reloaded!"
bind		    m   		    move-window -r \; display "Reorder!"

# 24bit truecolor 지원
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

########### host-local overrides ###########
# Per-machine additions (e.g. OSC52 clipboard on a headless remote) live here
# and stay out of this repo. Kept above the TPM block: tmux-continuum owns
# status-right and needs `run tpm` to stay last.
if-shell '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'

########### TPM & Plugins ###########

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# sane default settings (기존 설정과 충돌 거의 없음)
set -g @plugin 'tmux-plugins/tmux-sensible'

# 세션/윈도우/패널 복구
set -g @plugin 'tmux-plugins/tmux-resurrect'

# 자동 저장 + 자동 복구
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# tmux copy → system clipboard
#set -g @plugin 'tmux-plugins/tmux-yank'

# TPM bootstrap (반드시 맨 마지막)
run '~/.tmux/plugins/tpm/tpm'

